<div class="mt-3">

  <!-- Page title -->
  <div class="text-center mb-4">
    <h2 class="fw-bold">{{ heading }}</h2>
    <p>{{ description }}</p>
  </div>

  <!-- Training guide download -->
  <div class="mb-4 pt-2" *ngIf="pdfPath">
    <p class="mb-3" style="color: var(--text-color);">
      Download your guide before continuing — you will need it to get started.
    </p>
    <a [href]="pdfPath"
       download
       class="btn btn-lg btn-block fw-bold"
       style="background-color: var(--btn-bg-color); color: #fff;"
       (click)="onDownloadClicked()">
      <i class="fa fa-download me-2" aria-hidden="true"></i> Download Training Guide
    </a>
  </div>

  <!-- Continue to dashboard — not gated on download -->
  <!-- BUG-FIX ONB-BUG-02: btn-outline-dark rendered dark text (#343a40) against the
       dark-theme page background, making this button effectively invisible.
       Changed to btn bg-dark (same pattern as primary buttons throughout this app)
       so the background uses var(--btn-bg-color) with white text, giving legible
       contrast in both light and dark themes. -->
  <div class="border-top mt-4 pt-4 d-flex justify-content-end">
    <button type="button" class="btn bg-dark" (click)="continueToDashboard()">
      {{ continueLabel }}
    </button>
  </div>

</div>
