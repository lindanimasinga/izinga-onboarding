                <div class="d-flex justify-content-center mb-3">
                    <div class="d-flex flex-column align-items-center">
                        <div class="mb-3 text-center h5 lead">
                            Share your payment link or qr code so customers can scan or open it to pay
                        </div>

                        <div class="btn-group" role="group" aria-label="Tip actions">
                            <button class="btn btn-outline-secondary" type="button" (click)="copyTipLink()" title="Copy link" aria-label="Copy link">
                                <i class="material-icons me-1 small" aria-hidden="true">content_copy</i>
                                Copy Link
                            </button>

                            <button class="btn btn-outline-secondary" type="button" (click)="shareTip()" *ngIf="isWebShareAvailable" title="Share" aria-label="Share">
                                <i class="material-icons me-1" aria-hidden="true">share</i>
                                Share
                            </button>

                             <button *ngIf="isNFCAvailable" class="btn btn-outline-primary btn-sm" type="button" (click)="shareViaNFC()" title="Write tip link to NFC tag" aria-label="Write to NFC">
                                    <i class="material-icons me-1" aria-hidden="true">nfc</i>
                                    Receive NFC Payment
                            </button>
                        </div>
                        
                    </div>
                </div>
                
                <div id="exportPdf" #exportPdf>    
                    <div class="d-flex justify-content-center pt-3">
                        <img src="../../assets/images/izinga-logo.png" width="160">
                    </div>

                    <div class="h2 d-flex justify-content-center pt-3">
                    {{isStoreAdmin? 'Scan To Pay': 'TIP ME'}}
                    </div>
                    <div class="qrcodeImage d-flex justify-content-center pt-1">
                        <qrcode
                        [qrdata]="'https://tips.izinga.co.za/tip?messengerId='+ userProfile.id"
                        [allowEmptyString]="true"
                        [ariaLabel]="'QR Code image with the following content...'"
                        [cssClass]="'center'"
                        [colorDark]="'#000000'"
                        [colorLight]="'#ffffff'"
                        [elementType]="'canvas'"
                        [errorCorrectionLevel]="'M'"
                        [imageSrc]="'./assets/images/izinga-short.png'"
                        [imageHeight]="55"
                        [imageWidth]="55"
                        [margin]="2"
                        [scale]="1"
                        [title]="'A custom title attribute'"
                        [width]="300">
                        </qrcode>
                    </div>

                    <div class="d-flex justify-content-center h4 text-capitalize pb-5">
                        {{!isStoreAdmin ? userProfile.name: ''}}
                    </div>
                </div>

                <div class="btn btn-lg btn-block bg-dark mt-3 mb-3 shadow-sm" (click)="downloadPdf()">
                    Download As PDF
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="firstName">First name</label>
                        <input type="text" class="form-control text-capitalize" [(ngModel)]="userProfile.name" name="name" disabled>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="cellphone">Cellphone Number</label>
                    <div class="input-group">
                        <input type="text" class="form-control" [value]="userProfile.mobileNumber" name="mobileNumber" placeholder="cellphone" disabled>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="cellphone">Email Address</label>
                    <div class="input-group">
                        <input type="text" class="form-control" [value]="userProfile.emailAddress" name="emailAddress"
                            placeholder="Optional Email Address">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="cellphone">Tell us about your hustle?</label>
                    <div class="input-group">
                        <input type="text" class="form-control" [(ngModel)]="userProfile.description" name="roleDescription"
                            placeholder="Waitress">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="cellphone">Name your city?</label>
                    <div class="input-group">
                        <input type="text" class="form-control" [(ngModel)]="userProfile.address" name="city"
                            placeholder="Durban">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
