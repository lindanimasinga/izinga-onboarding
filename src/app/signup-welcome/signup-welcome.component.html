<div class="container py-4 signup-welcome-wrap mt-5">
  <div class="card border-0 shadow-sm p-4 text-center">
    <div class="welcome-icon mb-3">🎉</div>
    <h2 class="fw-bold mb-5">Welcome, {{ firstName }}!</h2>
    <p class="mb-2">
      Thank you for registering as a {{ profession }}. You will be working in {{ areaOfWork }}.
    </p>
    <p class="mb-0">
      Your profile is being reviewed. Please view and accept terms and conditions.
    </p>
  </div>
</div>

<div class="row fixed-bottom">
    <button class="col btn btn-lg btn-block bg-dark mt-5 shadow-sm" type="submit" [routerLink]="termsRoute"
    [disabled]="!canViewTerms">
    View Terms & Conditions</button>
</div>
