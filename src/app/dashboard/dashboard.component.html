<div class="mt-3">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <h3 class="mb-5">Dashboard</h3>
            <div class="row justify-content-center mb-5">
                <div class="col-6 mb-3">
                    <button class="btn btn-dark square-button" style="background-color: var(--btn-red-color);" routerLink="../user">
                        My Profile
                    </button>
                </div>
                <div *ngIf="isStoreAdmin" class="col-6 mb-3">
                    <button class="btn btn-dark square-button" style="background-color: #996216;" routerLink="../list">
                        My Businesses
                    </button>
                </div>
                <div class="col-6 mb-3">
                    <button class="btn btn-dark square-button" style="background-color: var(--btn-bg-color);" routerLink="../payout">
                        Payouts
                    </button>
                </div>
                <div class="col-6 mb-3">
                    <button class="btn btn-dark square-button" style="background-color: var(--btn-pill-color);" routerLink="../card">
                        iZinga Card
                    </button>
                </div>
            </div>
        </div>
    </div>

    <button class="btn btn-lg btn-block bg-dark mt-5 shadow-sm" type="submit" (click)="logout()">Logout</button>
                
</div>
