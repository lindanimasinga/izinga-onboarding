<div class="container py-4 my-businesses-container">
    <div class="text-center mb-4">
        <h2 class="fw-bold">My Orders</h2>
        <p class="text-muted">View your orders and track your progress.</p>
    </div>

    <!-- Orders Section Header -->
    <div class="mb-4">
        <div class="h3 fw-bold mt-2" style="font-family: Catamaran, Calibri, sans-serif;">Orders</div>
        <div class="text-muted mb-2" style="font-size: 1.1rem;">View and manage your recent orders below.</div>
    </div>

    <div class="row g-3">
        <div *ngFor="let order of orders" class="col-12 col-md-6 col-xl-4 d-flex mb-1">
            <app-order-card [order]="order" class="flex-fill"></app-order-card>
        </div>
    </div>

    <div *ngIf="orders?.length === 0" class="text-center text-muted mt-5" style="font-size: 1.2rem;">
        <span style="font-size: 2rem;">📭</span>
        <div>No orders found.</div>
    </div>
</div>
