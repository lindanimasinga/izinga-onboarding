<a (click)="selectedPayout()" routerLink="../payout-details" class="payout-card-link">
  <div class="card shadow-sm payout-card my-1 p-4" style="border-radius: 4px;">
    <div class="d-flex align-items-center">
      <div class="mr-3">
        <img [src]="store?.imageUrl" alt="{{store?.name}}" class="rounded-circle border" style="width: 84px; height: 84px; object-fit: cover; background: #f3f2f2;">
      </div>
      <div class="flex-grow-1">
        <div class="fw-bold mb-1" style="font-size: 1.1rem;">{{store?.name}}</div>
        <ng-container *ngIf="pendingPayoutTotal && pendingPayoutTotal > 0; else noPending">
          <div class="pending mb-1">
            Pending Payout
            <span class="amount fw-bold" style="font-size: 1.15rem;">{{pendingPayoutTotal | currency:'R':'symbol' }}</span>
          </div>
          <div class="completed text-muted small">Last 30 Days: {{completedPayoutTotal | currency:'R':'symbol' }}</div>
        </ng-container>
        <ng-template #noPending>
          <div class="completed-payout mb-1">
            Completed Payout
            <span class="amount fw-bold" style="font-size: 1.15rem;">{{completedPayoutTotal | currency:'R':'symbol' }}</span>
          </div>
          <div class="completed text-muted small">No pending payouts</div>
        </ng-template>
      </div>
      <div class="ms-2">
        <span class="material-icons" style="font-size: 2rem; color: #be833d;">chevron_right</span>
      </div>
    </div>
  </div>
</a>
