<div class="container mt-3 mb-3 d-flex justify-content-center">
  <a [routerLink]="dashboardRoute" style="cursor:pointer;">
    <div id="logo-image" class="logo-image" height="80px" #logoImage></div>
  </a>
</div>
<div class="container">
  <router-outlet></router-outlet>
  <div *ngIf="errorMessage" class="error my-5 py-3 d-flex justify-content-center">{{errorMessage}}</div>
  <div *ngIf="infoMessage" class="info-message my-5 py-3 d-flex justify-content-center">{{infoMessage}}</div>
</div>
<footer class="mt-4 pt-3 pb-4 border-top">
  <div class="container">
    <ul class="nav justify-content-center">
      <li class="nav-item">
        <a class="nav-link text-muted small" routerLink="/privacy-policy">Privacy Policy</a>
      </li>
    </ul>
    <p class="text-center text-muted small mb-0">Operated by Curiousoft (Pty) Ltd</p>
  </div>
</footer>
