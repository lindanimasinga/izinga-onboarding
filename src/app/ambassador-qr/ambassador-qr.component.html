<div class="mt-3">

  <!-- Loading state -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-secondary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="text-muted mt-3">Loading your QR code...</p>
  </div>

  <!-- Error state -->
  <div *ngIf="!loading && error" class="py-4 px-3">
    <div class="alert" style="border-left: 4px solid var(--btn-red-color); color: var(--text-color); background-color: var(--bkg-card-color);">
      <p class="mb-0">{{ error }}</p>
    </div>
  </div>

  <!-- QR code screen -->
  <div *ngIf="!loading && !error && qrImageUrl" class="text-center">

    <div class="text-center mb-4">
      <h2 class="fw-bold">Your Ambassador QR Code</h2>
      <p class="text-muted">Share this QR code or referral link to invite new drivers and earn rewards.</p>
    </div>

    <div class="d-flex justify-content-center mb-4">
      <img
        [src]="qrImageUrl"
        alt="Ambassador referral QR code"
        class="ambassador-qr-image"
      />
    </div>

    <div class="mb-4 px-3">
      <p class="text-muted small mb-1">Your referral link</p>
      <div class="referral-url-box">
        <span class="referral-url-text">{{ referralUrl }}</span>
      </div>
    </div>

    <!-- Copy link confirmation banner -->
    <div *ngIf="linkCopied" class="alert mx-3 mb-3" style="border-left: 4px solid var(--btn-green-color); color: var(--text-color); background-color: var(--bkg-card-color);">
      Link copied to clipboard!
    </div>

    <div class="d-grid gap-2 px-3 mb-4">
      <button class="btn btn-dark btn-lg" type="button" (click)="downloadQr()">
        Download QR Code
      </button>
      <button class="btn btn-outline-dark btn-lg" type="button" (click)="copyReferralLink()">
        {{ linkCopied ? 'Copied!' : 'Copy Referral Link' }}
      </button>
    </div>

  </div>

</div>
