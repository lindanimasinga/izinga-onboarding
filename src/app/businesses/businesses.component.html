<div class="my-businesses-container">

    <!-- Open Shops Section -->
    <div class="h5 mb-5 mt-3">My Businesses</div>
    <div class="d-flex justify-content-center mb-3">
        <div class="row">
            <div *ngFor="let store of stores" class="col-md-6 col-xl-4 px-2 py-2 d-flex justify-content-center">
                <app-store-card [store]="store"></app-store-card>
            </div>
        </div>
    </div>

    <div class="row fixed-bottom">
    <!-- Add New Stock Item Button -->
        <button type="button" class="col btn bg-dark shadow-sm" style="background-color: var(--btn-pill-color) !important;" routerLink="../info">Add New Business</button>
    </div>
</div>
