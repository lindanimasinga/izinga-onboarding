<div class="my-businesses-container">

    <div class="text-center mb-4">
        <h2 class="fw-bold">My Businesses</h2>
        <p class="text-muted">Manage your businesses and settings.</p>
    </div>
    
    <!-- Search Filter -->
    <div class="mb-4">
        <div class="input-group">
            <span class="input-group-text"><i class="fas fa-search"></i></span>
            <input 
                type="text" 
                class="form-control" 
                placeholder="Search businesses by name..."
                [(ngModel)]="searchTerm"
                (input)="filterBusinesses()">
            <button 
                *ngIf="searchTerm" 
                class="btn btn-outline-secondary" 
                type="button" 
                (click)="clearSearch()">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>
    <!-- REQ-16: empty state when owner has no shops at all -->
    <div *ngIf="isLoaded && filteredStores.length === 0 && !searchTerm" class="text-center py-5">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="mb-3 text-muted" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.97 1.35A1 1 0 0 1 3.73 1h8.54a1 1 0 0 1 .76.35l2.609 3.044A1.5 1.5 0 0 1 16 5.37v.255a2.375 2.375 0 0 1-4.25 1.458A2.371 2.371 0 0 1 9.875 8 2.37 2.37 0 0 1 8 7.083 2.37 2.37 0 0 1 6.125 8a2.37 2.37 0 0 1-1.875-.917A2.375 2.375 0 0 1 0 5.625V5.37a1.5 1.5 0 0 1 .361-.976zm1.78 4.275a1.375 1.375 0 0 0 2.75 0 .5.5 0 0 1 1 0 1.375 1.375 0 0 0 2.75 0 .5.5 0 0 1 1 0 1.375 1.375 0 1 0 2.75 0V5.37a.5.5 0 0 0-.12-.325L12.27 2H3.73L1.12 5.045A.5.5 0 0 0 1 5.37v.255a1.375 1.375 0 0 0 2.75 0 .5.5 0 0 1 1 0M1.5 8.5A.5.5 0 0 1 2 9v6h1v-5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v5h6V9a.5.5 0 0 1 1 0v6h.5a.5.5 0 0 1 0 1H.5a.5.5 0 0 1 0-1H1V9a.5.5 0 0 1 .5-.5M4 15h3v-5H4zm5-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1zm3 0h-2v3h2z"/>
        </svg>
        <h5 class="mb-2">You haven't added a shop yet.</h5>
        <button type="button" class="btn btn-dark" routerLink="../info">Add Your Shop</button>
    </div>

    <!-- No results message when searching -->
    <div *ngIf="filteredStores.length === 0 && searchTerm" class="text-center text-muted py-5">
        <i class="fas fa-search fa-3x mb-3 opacity-50"></i>
        <h5>No businesses found</h5>
        <p>No businesses match "{{searchTerm}}". Try a different search term.</p>
    </div>
    
    <div class="d-flex justify-content-center mb-3" *ngIf="filteredStores.length > 0">
        <div class="row">
            <div *ngFor="let store of filteredStores" class="col-md-6 col-xl-4 px-2 py-2 d-flex justify-content-center">
                <app-store-card [store]="store"></app-store-card>
            </div>
        </div>
    </div>

    <div class="row fixed-bottom">
    <!-- Add New Business Button -->
        <button type="button" class="col btn bg-dark" routerLink="../info">Add New Business</button>
    </div>
</div>
