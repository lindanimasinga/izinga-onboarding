<!-- REQ-01: max-width 960px centred on desktop; full-width on mobile -->
<div class="izinga-form-container">
    <div class="row">
        <div class="col order-md-1">

            <!-- REQ-03: loading state -->
            <div *ngIf="isLoading" class="alert alert-info d-flex align-items-center mt-3" role="alert">
                <span class="spinner-border spinner-border-sm mr-2" role="status" aria-hidden="true"></span>
                Loading stock&hellip;
            </div>

            <!-- REQ-03: load error -->
            <div *ngIf="loadError" class="alert alert-danger mt-3" role="alert">
                {{ loadError }}
            </div>

            <!-- REQ-03: save success banner -->
            <div *ngIf="saveSuccess" class="alert alert-success mt-3" role="alert">
                Stock saved successfully.
            </div>

            <!-- REQ-03: save error banner -->
            <div *ngIf="saveError" class="alert alert-danger mt-3" role="alert">
                {{ saveError }}
            </div>

            <!-- REQ-02: item removed notice -->
            <div *ngIf="itemRemoved" class="alert alert-warning mt-3" role="alert">
                Item removed. Press Update to save your changes, or navigate away to discard.
            </div>

            <!-- Dynamic Stock Items Section -->
            <div class="stock-items-section mt-2">

                <!-- REQ-09: heading — New vs Edit, h2 + subtitle -->
                <div class="text-center mb-4">
                    <h2 class="fw-bold">{{ stockItem.name ? 'Stock Item: ' + stockItem.name : 'New Stock Item' }}</h2>
                    <p class="text-muted">Edit the details below and press Update to save.</p>
                </div>

                <!-- NOTE-03: form hidden after a confirmed remove so only the notice + Update remain -->
                <!-- REQ-06: form element wraps all stock fields -->
                <form *ngIf="!itemRemoved" (ngSubmit)="registerBusinessAndStock()">

                    <div class="mb-3">
                        <!-- REQ-07: unique id/for pair -->
                        <label for="stockName-0" class="form-label">Product Name</label>
                        <input id="stockName-0" type="text" class="form-control" [(ngModel)]="stockItem.name" name="productName" placeholder="Enter product name" required>
                    </div>

                    <div class="mb-3">
                        <label for="stockGroup-0" class="form-label">Group Name</label>
                        <input id="stockGroup-0" type="text" class="form-control" [(ngModel)]="stockItem.group" name="groupName" placeholder="Enter Group name">
                    </div>

                    <div class="mb-3">
                        <label for="stockDesc-0" class="form-label">Short Description</label>
                        <input id="stockDesc-0" type="text" class="form-control" [(ngModel)]="stockItem.description" name="productDescription" placeholder="Brief product description">
                    </div>

                    <div class="mb-3">
                        <label for="stockDetailedDesc-0" class="form-label">Detailed Description</label>
                        <textarea id="stockDetailedDesc-0" class="form-control" [(ngModel)]="stockItem.detailedDescription" rows="2" name="productDetails" placeholder="Detailed description of the product"></textarea>
                    </div>

                    <!-- REQ-08: price field with R prefix + min/max -->
                    <div class="mb-3">
                        <label for="stockPrice-0" class="form-label">Price</label>
                        <div class="input-group">
                            <span class="input-group-text">R</span>
                            <input id="stockPrice-0" type="number" class="form-control" [(ngModel)]="stockItem.storePrice" placeholder="0.00" name="productPrice" min="0" max="99999" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="stockQty-0" class="form-label">Quantity</label>
                        <input id="stockQty-0" type="number" class="form-control" [(ngModel)]="stockItem.quantity" placeholder="Available quantity" name="productQuantity" required>
                    </div>

                    <div class="mb-3">
                        <label for="stockImages-0" class="form-label">Upload Product Images</label>
                        <input id="stockImages-0" type="file" class="form-control" (change)="onFileSelected($event)" accept="image/*" multiple>
                        <!-- REQ-03: thumbnail preview — hidden when no URL -->
                        <img [src]="imagePreviewUrl" [hidden]="!imagePreviewUrl"
                             style="max-width: 120px; max-height: 120px; object-fit: cover; margin-top: 8px;"
                             alt="Stock item preview">
                    </div>

                    <!-- REQ-05: flex-wrap tag chips with 8px gap -->
                    <div class="mb-3">
                        <label class="form-label">Tags</label>
                        <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;" class="mb-2">
                            <ng-container *ngFor="let t of tagEntries; let i = index">
                                <span class="izinga-chip d-inline-flex align-items-center">
                                    {{ t }}
                                    <span role="button" style="cursor: pointer; margin-left: 4px;" (click)="removeTagRow(i)" aria-label="Remove tag">&#x2715;</span>
                                </span>
                            </ng-container>
                            <input
                                type="text"
                                class="form-control"
                                style="width: 140px; flex-shrink: 0;"
                                placeholder="New tag"
                                [(ngModel)]="newTag"
                                name="newTag"
                            >
                            <!-- REQ-05: btn-outline-dark, type="button" to not submit form -->
                            <button type="button" class="btn btn-outline-dark btn-sm" (click)="addTagRow()">Add tag</button>
                        </div>
                    </div>

                </form>
            </div>


        </div>
    </div>
</div><!-- end .izinga-form-container -->

<!-- REQ-14: padding-bottom clears fixed bar -->
<div style="padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));"></div>

<!-- REQ-06: fixed-bottom bar — d-flex, flex:1 per button, no wrapping -->
<div class="d-flex fixed-bottom" style="background: var(--bkg-card-color, #fff); border-top: 1px solid #dee2e6; padding: 8px;">
    <!-- REQ-02: hide Remove when item has no id (brand-new unsaved) -->
    <button *ngIf="stockItem.id" type="button"
            class="btn btn-outline-danger"
            style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 8px;"
            (click)="removeStockItem(stockItem)">Remove</button>

    <!-- REQ-03: spinner + disabled while saving -->
    <button class="btn btn-dark"
            type="submit"
            style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
            [disabled]="isSaving"
            (click)="registerBusinessAndStock()">
        <span *ngIf="isSaving" class="spinner-border spinner-border-sm mr-1" role="status" aria-hidden="true"></span>
        {{ isSaving ? 'Saving…' : 'Update' }}
    </button>
</div>
